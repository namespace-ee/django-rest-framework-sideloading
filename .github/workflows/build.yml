name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.version.python }}, Django ${{ matrix.version.django }}, ${{ matrix.extras.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          # Django 5.2 LTS - Python 3.10 … 3.14
          - { python: "3.10", django: "5.2" }
          - { python: "3.11", django: "5.2" }
          - { python: "3.12", django: "5.2" }
          - { python: "3.13", django: "5.2" }
          - { python: "3.14", django: "5.2" }
          # Django 6.0 - Python 3.12, 3.13, 3.14
          - { python: "3.12", django: "6.0" }
          - { python: "3.13", django: "6.0" }
          - { python: "3.14", django: "6.0" }
          # Django 6.1 - Python 3.12, 3.13, 3.14
          - { python: "3.12", django: "6.1" }
          - { python: "3.13", django: "6.1" }
          - { python: "3.14", django: "6.1" }
        extras:
          - { name: "no extras", flag: "" }
          - { name: "all extras", flag: "--all-extras" }

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.version.python }}
        run: uv python install ${{ matrix.version.python }}

      - name: Test
        run: uv run --python ${{ matrix.version.python }} --with 'Django>=${{ matrix.version.django }},<${{ matrix.version.django }}.99' ${{ matrix.extras.flag }} pytest tests/ -v

  build:
    name: Build package
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    environment:
      name: pypi
      url: https://pypi.org/p/drf-sideloading
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
