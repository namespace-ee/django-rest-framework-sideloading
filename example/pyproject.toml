[project]
name = "drf-sideloading-example"
version = "0"
description = "Example project demonstrating drf-sideloading"
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.16",
    "django-debug-toolbar",
    "drf-sideloading",
]

[tool.uv]
package = false

[tool.uv.sources]
# Always run the example against the working copy of the library.
drf-sideloading = { path = "..", editable = true }
